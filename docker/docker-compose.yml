version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: saksham_postgres
    environment:
      POSTGRES_DB: saksham_db
      POSTGRES_USER: saksham_admin
      POSTGRES_PASSWORD: saksham_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/01_saksham_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: saksham_backend
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://saksham_admin:saksham_secure_pass@postgres:5432/saksham_db
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-saksham_secure_dev_jwt_secret_2026}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: saksham_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
